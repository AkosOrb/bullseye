# Android telepítőcsomag (APK) automatikus építése.
# Minden feltöltés után lefut; az elkészült APK a GitHub "Actions" fülén,
# a futás oldalán az "Artifacts" résznél tölthető le (lolap-kiertekelo-apk).
name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lolap-kiertekelo-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
